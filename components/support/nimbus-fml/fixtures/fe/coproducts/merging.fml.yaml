---
about:
  description: Merging of coproduct defaults.
  kotlin:
    class: .nimbus.MyNimbus
    package: com.example.app
channels:
  - release
  - beta
  - nightly
features:
  home:
    description: The home screen.
    variables:
      promo:
        description: Switches variant in some channels.
        type: Promo
        default:
          title: "Welcome"
      page:
        description: An object with a coproduct field.
        type: Page
        default:
          promo:
            $type: Carousel
            slides: ["page"]
      optional-promo:
        description: An optional coproduct.
        type: Option<Promo>
        default: null
      promos:
        description: A map of coproducts.
        type: Map<String, Promo>
        default:
          first:
            title: "First"
    defaults:
      # This applies to all channels: it changes the title of the Banner.
      - value:
          promo:
            title: "Hello"
      # Beta changes the variant to a Carousel: the title of the Banner is discarded.
      - channel: beta
        value:
          promo:
            $type: Carousel
            slides: ["beta"]
          optional-promo:
            $type: Carousel
          promos:
            first:
              $type: Carousel
            second:
              title: "Second"
      # Nightly changes the variant to a Carousel, and then changes only the autoplay of the Carousel.
      - channel: nightly
        value:
          promo:
            $type: Carousel
            slides: ["nightly"]
      - channel: nightly
        value:
          promo:
            $type: Carousel
            autoplay: true
          page:
            promo:
              title: "Banner in the page"
objects:
  Page:
    description: A page with a promotion.
    fields:
      name:
        description: The name of the page.
        type: String
        default: "page"
      promo:
        description: The promotion on the page.
        type: Promo
        default:
          title: "Page banner"
  Banner:
    description: A banner with a title.
    fields:
      title:
        description: The title.
        type: String
        default: ""
      dismissable:
        description: Whether the user can dismiss the banner.
        type: Boolean
        default: true
  Carousel:
    description: A carousel of slides.
    fields:
      slides:
        description: The slides.
        type: List<String>
        default: []
      autoplay:
        description: Whether the carousel moves automatically.
        type: Boolean
        default: false
coproducts:
  Promo:
    description: A promotion.
    default-variant: Banner
    variants:
      - Banner
      - Carousel
